
version: 2

models:

  
  - name: dim_date
    description: "Date dimension for daily, monthly, quarterly and yearly supply chain analysis."

    columns:
      - name: date
        tests:
          - unique
          - not_null

      - name: day
      - name: month
      - name: month_name
      - name: quarter
      - name: year
      - name: year_month
      - name: month_year
      - name: day_of_week
      - name: day_name
      - name: day_type


  - name: dim_store
    description: "Store dimension containing store and regional information."
    columns:
      - name: store_id
        description: "Store identifier."
        tests:
          - unique
          - not_null

      - name: region
        description: "Region where the store operates."

  - name: dim_product
    description: "Product dimension containing product and category information."
    columns:
      - name: product_id
        description: "Product identifier."
        tests:
          - unique
          - not_null

      - name: category
        description: "Product category."

  - name: fact_supply_chain
    description: "Fact table containing daily store-level and product-level supply chain metrics."
    columns:
      - name: date
        tests:
          - not_null

      - name: store_id
        tests:
          - not_null

      - name: product_id
        tests:
          - not_null

      - name: units_sold
        description: "Actual units sold."

      - name: inventory_level
        description: "Available inventory."

      - name: demand_forecast
        description: "Forecasted demand."
